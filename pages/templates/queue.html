<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />
    <link href="../dist/output.css" rel="stylesheet" />
    <link rel="stylesheet" href="../src/css/queue.css">
</head>
<body class="bg-primary">
<main class="p-5">
    <h2 class="text-[5vh]">Список заказанных треков</h2>
    <section class="w-full mt-10">
        <ul class="w-full grid grid-cols-1 justify-items-center gap-4 sm:grid-cols-3 lg:grid-cols-4">
            <li class="w-50 rounded-2xl bg-white/5 p-3 transition hover:bg-white/10">

                <div class="relative aspect-square overflow-hidden rounded-xl bg-linear-to-br from-indigo-500 via-purple-500 to-pink-500">
                    <div class="absolute -right-8 -top-8 h-32 w-32 rounded-full bg-white/20 blur-2xl"></div>
                    <div class="absolute -bottom-10 -left-10 h-36 w-36 rounded-full bg-black/20 blur-2xl"></div>
                    <div class="absolute inset-0 flex items-center justify-center">
                        <span class="text-4xl font-bold text-white/90">
                            SS
                        </span>
                    </div>
                </div>
                <div class="mt-3">
                    <p class="truncate font-medium text-white">
                        Space Song
                    </p>
                    <p class="truncate text-sm text-white/50">
                        Beach House
                    </p>
                </div>

            </li>
        </ul>
    </section>
</main>
    
</body>
</html>
