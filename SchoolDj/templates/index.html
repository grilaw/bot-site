{% load static %} {% load django_vite %}
<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="{% static 'frontend/favicon.svg' %}"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&display=swap"
      rel="stylesheet"
    />

    <title>SchoolDJ</title>
    {% vite_hmr_client %} {% vite_react_refresh %}
  </head>
  <body>
    <script>
      window.CURRENT_USER = {% if user.is_authenticated %}
        {
          username: "{{ user.username|escapejs }}",
          avatar: "{{ user.profile.avatar.url|escapejs }}"
        }
      {% else %}
        null
      {% endif %};
    </script>
    <div id="root"></div>

    {% vite_asset 'src/main.jsx' %}
  </body>
</html>
